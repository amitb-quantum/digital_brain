# Tier 3: rented vast.ai H100/H200. Same model, larger scale. Not yet validated.
name: vast_h200
backend:
  device: cuda_standalone
stimulus:
  size: 64
  max_rate_hz: 96.0      # bars are 2x longer than at 32x32; halving the rate keeps input per
                         # presentation constant. 192 Hz: 71% of neurons fire before training (2026-10-12)
network:
  n_exc: 6400
training:
  n_presentations: 20000
